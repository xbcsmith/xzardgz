# SAST ruleset sources manifest for xzardgz.
#
# This file lists known public SAST rule repositories.
# All sources are disabled by default.
# Review each source's licence before enabling it.
#
# To enable a source:
#   1. Set enabled: true
#   2. Run: xzardgz ruleset sync <source-id>
#   3. Verify: xzardgz ruleset doctor
#
# Licence classes and default policy:
#   ALLOWED: Permissive (MIT, Apache-2.0, BSD-*), WeakCopyleft (LGPL, MPL)
#   DENIED:  StrongCopyleft (GPL), NetworkCopyleft (AGPL), NonCommercial, Restricted, Unknown

