rules:
  - id: regex-hardcoded-secret-assignment
    message: >
      A variable or field assignment pattern matching 'password', 'secret',
      'api_key', or 'token' is assigned a quoted string literal (CWE-798).
      Hardcoded credentials appear in source control and compiled artifacts.
      Use environment variables or a secrets manager instead.
    languages:
      - regex
    severity: WARNING
    metadata:
      cwe:
        - CWE-798
        - CWE-259
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: LOW
      category: security
      license: Apache-2.0
    pattern-regex: '(?i)(?:password|secret|api_key|token)\s*[:=]\s*"(?P<VALUE>[^"]{6,})"'
