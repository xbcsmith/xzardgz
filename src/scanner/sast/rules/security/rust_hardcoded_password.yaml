rules:
  - id: rust-hardcoded-password-field
    message: >
      A field named 'password' is assigned a string literal (CWE-798).
      Hardcoded credentials are exposed in source control and compiled
      binaries. Store credentials in environment variables or a secrets
      manager and read them at runtime.
    languages:
      - rust
    severity: ERROR
    metadata:
      cwe:
        - CWE-798
        - CWE-259
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      category: security
      license: Apache-2.0
      technology:
        - rust
    pattern-either:
      - pattern: |
          $STRUCT { ..., password: "$VALUE", ... }
      - pattern: let $VAR = "$VALUE"; // password
      - pattern: |
          $STRUCT { ..., api_key: "$VALUE", ... }
      - pattern: |
          $STRUCT { ..., secret: "$VALUE", ... }
