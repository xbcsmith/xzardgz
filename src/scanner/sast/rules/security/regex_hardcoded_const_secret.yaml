rules:
  - id: regex-hardcoded-const-secret
    message: >
      A compile-time constant named after a secret value is assigned a string
      literal (CWE-798, CWE-259). Constants appear verbatim in compiled binaries
      and in source-control history. Supply secret values at runtime via
      environment variables or a secrets manager; never bake them into the binary.
    languages:
      - regex
    severity: ERROR
    metadata:
      cwe:
        - CWE-798
        - CWE-259
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      category: security
      license: Apache-2.0
    pattern-regex: '(?i)\bconst\s+(?P<NAME>[A-Z_]*(?:API_KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[A-Z_]*)\s*:\s*&(?:''static\s+)?str\s*=\s*"[^"]{3,}"'
