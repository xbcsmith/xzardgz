rules:
  - id: rust-weak-rsa-key
    message: >
      RSA keys shorter than 2048 bits are cryptographically weak and vulnerable
      to factorization attacks (CWE-326). Use at least 2048 bits; prefer 4096
      bits for long-lived keys.
    languages:
      - rust
    severity: WARNING
    metadata:
      cwe:
        - CWE-326
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      category: security
      license: Apache-2.0
      technology:
        - rust
        - rsa
    patterns:
      - pattern: RsaPrivateKey::new(&mut $RNG, $BITS)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048
      - focus-metavariable: $BITS
    fix: RsaPrivateKey::new(&mut $RNG, 2048)
