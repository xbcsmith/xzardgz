version: "1"
name: "local security review"
description: "Run a thorough security review against a local repository checkout. Produces SARIF output suitable for upload to GitHub Advanced Security or other SARIF-compatible tooling."

repository:
  path: "."
  branch: "main"

workspace:
  root: ".xzardgz/workspaces"
  resume: true

provider:
  name: "openai"
  model: "gpt-4.1-mini"

scan:
  output: ".xzardgz/scan/security_review_local_scan.json"
  ignore_patterns:
    - "target"
    - ".git"
    - "node_modules"

steps:
  - id: "scan"
    type: "scan"
    description: "Scan repository structure and produce scan artifact"

  - id: "security_review"
    type: "plugin"
    description: "Run the security review plugin with low severity threshold and SARIF output"
    plugin: "security-review"
    depends_on:
      - "scan"
    config:
      max_findings: 50
      severity_threshold: "low"
      include_sarif: true

reports:
  output_dir: ".xzardgz/reports"
  formats:
    - "markdown"
    - "json"
    - "sarif"
