version: "1"
name: "repository technical review"
description: "Scan a repository and run the technical review plugin"

repository:
  path: "."
  branch: "main"

workspace:
  root: ".xzardgz/workspaces"
  resume: true

provider:
  name: "openai"
  model: "gpt-4.1-mini"

scan:
  output: ".xzardgz/scan/analyze_repo_scan.json"
  ignore_patterns:
    - "target"
    - ".git"
    - "node_modules"

steps:
  - id: "scan"
    type: "scan"
    description: "Scan repository structure and produce scan artifact"

  - id: "technical_review"
    type: "plugin"
    description: "Run the technical review plugin"
    plugin: "technical-review"
    depends_on:
      - "scan"
    config:
      max_findings: 25
      severity_threshold: "medium"
      focus_areas:
        - "architecture"
        - "reliability"
        - "maintainability"

reports:
  output_dir: ".xzardgz/reports"
  formats:
    - "markdown"
    - "json"
