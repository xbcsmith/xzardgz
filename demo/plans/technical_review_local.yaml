version: "1"
name: "local technical review"
description: "Run a comprehensive technical review against a local repository checkout. Suitable for developer workstations and local CI environments where the repository is already present on disk."

repository:
  path: "."
  branch: "main"

workspace:
  root: ".xzardgz/workspaces"
  resume: true

provider:
  name: "openai"
  model: "gpt-4.1-mini"

scan:
  output: ".xzardgz/scan/technical_review_local_scan.json"
  ignore_patterns:
    - "target"
    - ".git"
    - "node_modules"

steps:
  - id: "scan"
    type: "scan"
    description: "Scan repository structure and produce scan artifact"

  - id: "technical_review"
    type: "plugin"
    description: "Run the technical review plugin with full focus area coverage"
    plugin: "technical-review"
    depends_on:
      - "scan"
    config:
      max_findings: 20
      severity_threshold: "low"
      focus_areas:
        - "architecture"
        - "reliability"
        - "maintainability"
        - "performance"
        - "testability"

reports:
  output_dir: ".xzardgz/reports"
  formats:
    - "markdown"
    - "json"
