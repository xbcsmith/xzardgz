version: "1"
name: "simple security review"
description: "Scan a repository and run the security review plugin"

repository:
  path: "."
  branch: "main"

workspace:
  root: ".xzardgz/workspaces"
  resume: true

provider:
  name: "openai"
  model: "gpt-4.1-mini"

scan:
  output: ".xzardgz/scan/security_scan.json"
  ignore_patterns:
    - "target"
    - ".git"
    - "node_modules"

steps:
  - id: "scan"
    type: "scan"
    description: "Scan repository structure and produce scan artifact"

  - id: "security_review"
    type: "plugin"
    description: "Run the security review plugin with SARIF output"
    plugin: "security-review"
    depends_on:
      - "scan"
    config:
      max_findings: 25
      severity_threshold: "medium"
      include_sarif: true

reports:
  output_dir: ".xzardgz/reports"
  formats:
    - "markdown"
    - "json"
    - "sarif"
