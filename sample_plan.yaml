version: "1"
name: "Sample Technical Review"
description: "Scan the repository and run the technical review plugin"
repository: "."
branch: ~
workspace: ~

steps:
  - id: technical_review
    description: "Run technical review plugin"
    plugin: technical-review
    dependencies: []
    report_formats:
      - markdown
      - json
    max_findings: 50
    severity_threshold: low

reports:
  output_dir: ".xzardgz/reports"
  formats:
    - markdown
    - json
  overwrite: true

dry_run: false
resume: false
