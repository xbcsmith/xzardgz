name: "Repository Technical Review"
description: "Scan a repository and run the technical review plugin"
repository: "."

steps:
  - id: "scan"
    description: "Scan repository structure"
    action:
      type: "scan_repository"
      params: null
    dependencies: []

  - id: "technical_review"
    description: "Run the technical review plugin"
    action:
      type: "run_plugin"
      params:
        plugin: "technical-review"
    dependencies: ["scan"]

deliverables:
  - name: "Technical Review Report"
    description: "Markdown report produced by the technical review plugin"
    path: ".xzardgz/reports/technical_review.md"
  - name: "Technical Review Findings"
    description: "JSON findings produced by the technical review plugin"
    path: ".xzardgz/reports/technical_review.json"
